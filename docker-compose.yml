# Alternative to run.sh. Set WEIGHTS_DIR to the downloaded weights, then: docker compose up
# (build once with: docker compose build)
services:
  longcat-next:
    build: .
    image: longcat-next-gb10
    container_name: longcat-next
    runtime: nvidia
    gpus: all
    # SGLang passes multimodal pixel tensors between processes via /dev/shm; Docker's
    # 64MB default SIGBUS-crashes multi-image requests. tmpfs allocates lazily.
    shm_size: "32gb"
    ports:
      # SECURITY DEFAULT: loopback only. To expose on a network, change to "0.0.0.0:8090:8090"
      # (or a host IP) AND set LCN_API_KEY below — otherwise the API is unauthenticated.
      - "127.0.0.1:8090:8090"
    volumes:
      - ${WEIGHTS_DIR:?set WEIGHTS_DIR to the downloaded weights directory}:/workspace/model:ro
      - ./outputs:/workspace/outputs
    environment:
      - LCN_OUTPUT_DIR=/workspace/outputs
      # Required bearer token IF you expose the port off-loopback (clients send
      # `Authorization: Bearer <secret>`). Leave unset for the loopback-only default.
      - LCN_API_KEY=${LCN_API_KEY:-}
      # optional tuning (full reference + defaults: README "Tuning (env vars)";
      # verify what actually took effect via GET /status):
      # - LCN_AGENT=1         # agent profile: generation endpoints 403, head memory never allocated
      # - LCN_YARN=1          # extend context 128k -> 256k via YaRN (opt-in; see README)
      # - MEM_FRACTION=0.72   # 0.74 is the default under LCN_YARN. Read the README's
      #                       # hard-power-off warning before raising.
      # - MAX_TOTAL_TOKENS=131072   # 917504 + MEM_FRACTION=0.88 + LCN_AGENT=1 = the
      #                       # measured ~6-context multi-session recipe
      # - LCN_CUDAGRAPH=1     # decode CUDA graphs (default ON; 0 restores eager)
      # - LCN_HEAD_GRAPH=1    # generation-head graph replay (default ON; math-identical)
      # - LCN_INT8_HEADS=audio  # per-head int8 FFN: audio (default) | visual | both | 0.
      #                       # 'both' is ~8% faster images at a measured spatial-quality cost.
      # - LCN_NGRAM=1         # n-gram speculative decoding (opt-in; coexists with generation)
      # - LCN_TTS_STREAM=1    # streaming TTS vocoder (default ON)
      # - LCN_TTS_MULTI=1     # multi-sentence TTS rounds (default ON)
      # - LCN_TTS_TRIM_LEAD_MS=150  # onset silence trim; LCN_TTS_TRIM_TAIL_MS=250 the tail twin
      # - IMAGE_GEN_CFG_SCALE=3.0
      # - LCN_REFINER_CFG_RANGE=0.0,1.0  # refiner classifier-free guidance range. DEFAULT
      #                       # 1.0,0.0 (empty interval = guidance OFF; every denoise step is
      #                       # one transformer forward instead of three, -16.9% per image).
      #                       # Owner-reviewed: a three-arm A/B (all steps / first half / off)
      #                       # read as equivalent quality. Set 0.0,1.0 to restore the
      #                       # original full-guidance refiner, 0.0,0.5 for the middle ground.
      # - LCN_KEEP_ARTIFACTS=1  # keep generated files in ./outputs (default: delete after serving)
      # - LCN_VERBOSE=0
      # - LCN_PREWARM=1       # warm BOTH generation paths at startup (~4-5 min; /status
      #                       # reports pending/running/ready — 'degraded' = a path failed)
      #                       # instead of making the first real request pay the lazy costs
    # Bounded restart, not "always": the entrypoint exits 1 when a managed process dies,
    # so a transient failure recovers unattended, while a genuine misconfiguration stops
    # after 3 attempts instead of crash-looping a ~90GB model load against a 128GB box.
    restart: on-failure:3
